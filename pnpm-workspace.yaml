packages:
  - packages/*

allowBuilds:
  dprint: true
  esbuild: true

blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - comline@0.8.1
  - treetrunks@0.1.12
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.1
  vitest: 5.0.1
  vite-plus: 1.0.0-rc.1
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
